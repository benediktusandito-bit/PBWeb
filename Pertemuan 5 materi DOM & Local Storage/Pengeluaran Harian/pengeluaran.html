<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencatat Pengeluaran Harian</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Attributes 'defer': Menunggu parser HTML selesai sebelum mengeksekusi JS -->
    <script src="pengeluaran.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>Pencatat Pengeluaran</h1>
      </header>

      <main class="app-main">
        <!-- Section Kartu Ringkasan Total Saldo/Pengeluaran -->
        <section
          class="card summary-card"
          style="background: var(--primary-color); color: white"
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <div>
              <p style="font-size: 0.85rem; opacity: 0.8">Total Pengeluaran:</p>
              <!-- Menampilkan hasil perhitungan reduce() dari data yang ter-filter -->
              <h2
                id="total-filtered"
                style="font-size: 1.5rem; margin-top: 2px"
              >
                Rp 0
              </h2>
            </div>
            <div style="text-align: right">
              <p style="font-size: 0.85rem; opacity: 0.8">Semua Transaksi:</p>
              <!-- Menampilkan hasil perhitungan reduce() dari seluruh data -->
              <h3 id="total-all" style="font-size: 1.1rem; margin-top: 2px">
                Rp 0
              </h3>
            </div>
          </div>
        </section>

        <!-- Section Form Input / Edit Transaksi -->
        <section class="card">
          <form id="expense-form" novalidate>
            <!-- Hidden input untuk menyimpan ID transaksi saat mode edit aktif -->
            <input type="hidden" id="expense-id" />

            <div class="form-group">
              <label for="desc-input">Deskripsi</label>
              <input type="text" id="desc-input" autocomplete="off" />
            </div>

            <div class="form-group" style="margin-top: 10px">
              <label for="amount-input">Nominal (Rp)</label>
              <input type="number" id="amount-input" min="1" />
            </div>

            <div class="form-group" style="margin-top: 10px">
              <label for="category-input">Kategori</label>
              <select id="category-input" class="form-select">
                <option value="Makanan">Makanan</option>
                <option value="Transportasi">Transportasi</option>
                <option value="Belanja">Belanja</option>
                <option value="Utilitas">Utilitas</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>

            <div class="form-group" style="margin-top: 10px">
              <label for="date-input">Tanggal</label>
              <input type="date" id="date-input" />
            </div>

            <div style="margin-top: 14px; display: flex; gap: 8px">
              <button type="submit" id="save-button" style="flex: 1">
                Simpan Transaksi
              </button>
              <!-- Tombol Batal Edit (sembunyi di mode tambah) -->
              <button
                type="button"
                id="cancel-edit-btn"
                class="btn-action btn-delete"
                hidden
                style="padding: 8px 14px"
              >
                Batal
              </button>
            </div>

            <!-- Wadah pesan error validasi input -->
            <p
              id="expense-error"
              class="error-message"
              hidden
              style="margin-top: 8px"
            ></p>
          </form>
        </section>

        <!-- Section Controls (Pencarian & Filter Kategori/Tanggal) -->
        <section class="card controls-section">
          <!-- Input pencarian deskripsi -->
          <div class="search-wrapper">
            <input
              type="search"
              id="search-input"
              placeholder="Cari transaksi"
            />
          </div>

          <!-- Dropdown Kategori & Input Filter Tanggal -->
          <div style="display: flex; gap: 8px; margin-top: 6px">
            <div class="form-group" style="flex: 1">
              <label
                for="filter-category"
                style="font-size: 0.8rem; margin-bottom: 4px"
                >Kategori:</label
              >
              <select
                id="filter-category"
                class="form-select"
                style="font-size: 0.85rem; padding: 6px"
              >
                <option value="all">Semua</option>
                <option value="Makanan">Makanan</option>
                <option value="Transportasi">Transportasi</option>
                <option value="Belanja">Belanja</option>
                <option value="Utilitas">Utilitas</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>

            <div class="form-group" style="flex: 1">
              <label
                for="filter-date"
                style="font-size: 0.8rem; margin-bottom: 4px"
                >Tanggal / Filter:</label
              >
              <input
                type="date"
                id="filter-date"
                style="font-size: 0.85rem; padding: 6px"
              />
            </div>
          </div>
          <!-- Tombol reset filter tanggal (tampil saat tanggal diisi) -->
          <button
            type="button"
            id="reset-filter-btn"
            class="btn-action"
            style="background: #e2e8f0; margin-top: 4px"
            hidden
          >
            Reset Filter Tanggal
          </button>
        </section>

        <!-- Section Daftar Transaksi -->
        <section class="card list-section">
          <div
            class="list-header"
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <h2>Daftar Transaksi (<span id="expense-count">0</span>)</h2>
            <!-- Tombol Hapus Semua dengan konfirmasi -->
            <button
              type="button"
              id="clear-all-btn"
              class="btn-action btn-delete"
              style="font-size: 0.75rem; padding: 4px 8px"
            >
              Hapus Semua
            </button>
          </div>

          <!-- Pesan ketika daftar transaksi kosong -->
          <div id="empty-state" class="empty-state" hidden>
            <p id="empty-message">Belum ada catatan transaksi.</p>
          </div>

          <!-- List <ul> yang diisi secara dinamis dari Javascript -->
          <ul id="expense-list" class="task-list"></ul>
        </section>
      </main>
    </div>
  </body>
</html>
