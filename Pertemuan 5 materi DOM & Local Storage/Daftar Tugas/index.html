<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Daftar Tugas</title>
    <link rel="stylesheet" href="style.css" />
    <!-- 'defer': Tunggu HTML selesai diparse baru jalankan script -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>Daftar Tugas</h1>
      </header>

      <main class="app-main">
        <!-- Section Form Input -->
        <section class="card">
          <!-- 'novalidate': Matikan validasi bawaan browser -->
          <form id="task-form" novalidate>
            <div class="form-group">
              <label for="task-input">Nama Tugas</label>
              <div class="input-wrapper">
                <input
                  type="text"
                  id="task-input"
                  name="title"
                  autocomplete="off"
                />
                <button type="submit" id="add-button">Tambah</button>
              </div>
              <!-- Tempat pesan error (hidden saat normal) -->
              <p id="task-error" class="error-message" hidden></p>
            </div>
          </form>
        </section>

        <!-- Section Filter & Pencarian -->
        <section class="card controls-section">
          <div class="search-wrapper">
            <input type="search" id="search-input" placeholder="Cari tugas" />
          </div>

          <div class="filter-buttons">
            <!-- 'data-filter': Dibaca JS untuk filter status -->
            <button type="button" class="btn-filter active" data-filter="all">
              Semua
            </button>
            <button type="button" class="btn-filter" data-filter="active">
              Aktif
            </button>
            <button type="button" class="btn-filter" data-filter="completed">
              Selesai
            </button>
          </div>
        </section>

        <!-- Section List Utama -->
        <section class="card list-section">
          <div class="list-header">
            <!-- Counter jumlah tugas -->
            <h2>Daftar Tugas (<span id="task-count">0</span>)</h2>
          </div>

          <!-- Pesan jika daftar kosong -->
          <div id="empty-state" class="empty-state" hidden>
            <p id="empty-message">Belum ada tugas yang ditambahkan.</p>
          </div>

          <!-- Container untuk menampung item li dari JS & event delegation -->
          <ul id="task-list" class="task-list"></ul>
        </section>
      </main>
    </div>
  </body>
</html>
