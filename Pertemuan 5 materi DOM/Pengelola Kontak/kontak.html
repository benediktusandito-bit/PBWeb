<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pengelola Kontak Lokal</title>
    <link rel="stylesheet" href="style.css" />
    <!-- 'defer': Menunggu DOM HTML selesai dimuat sebelum menjalankan JS -->
    <script src="kontak.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>Pengelola Kontak</h1>
      </header>

      <main class="app-main">
        <!-- Section Form Tambah/Edit Kontak -->
        <section class="card">
          <form id="contact-form" novalidate>
            <!-- Hidden input untuk menyimpan ID kontak yang sedang di-edit -->
            <input type="hidden" id="contact-id" />

            <div class="form-group">
              <label for="name-input">Nama</label>
              <input type="text" id="name-input" autocomplete="off" />
            </div>

            <div class="form-group" style="margin-top: 10px">
              <label for="phone-input">Nomor Telepon</label>
              <input type="tel" id="phone-input" autocomplete="off" />
            </div>

            <div class="form-group" style="margin-top: 10px">
              <label for="email-input">Email</label>
              <input type="email" id="email-input" autocomplete="off" />
            </div>

            <div class="form-group" style="margin-top: 10px">
              <label for="category-input">Kategori</label>
              <select id="category-input" class="form-select">
                <option value="Keluarga">Keluarga</option>
                <option value="Teman">Teman</option>
                <option value="Kerja">Kerja</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>

            <div style="margin-top: 14px; display: flex; gap: 8px">
              <button type="submit" id="save-button" style="flex: 1">
                Simpan Kontak
              </button>
              <!-- Tombol batal edit (hidden saat mode tambah) -->
              <button
                type="button"
                id="cancel-edit-btn"
                class="btn-action btn-delete"
                hidden
                style="padding: 8px 14px"
              >
                Batal
              </button>
            </div>

            <!-- Container pesan error validasi -->
            <p
              id="contact-error"
              class="error-message"
              hidden
              style="margin-top: 8px"
            ></p>
          </form>
        </section>

        <!-- Section Controls (Pencarian & Filter Kategori) -->
        <section class="card controls-section">
          <!-- Input pencarian nama/email -->
          <div class="search-wrapper">
            <input
              type="search"
              id="search-input"
              placeholder="Cari nama atau email"
            />
          </div>

          <!-- Dropdown filter kategori -->
          <div class="form-group" style="margin-top: 6px">
            <label
              for="filter-category"
              style="font-size: 0.85rem; margin-bottom: 4px"
              >Filter Kategori:</label
            >
            <select id="filter-category" class="form-select">
              <option value="all">Semua Kategori</option>
              <option value="Keluarga">Keluarga</option>
              <option value="Teman">Teman</option>
              <option value="Kerja">Kerja</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
        </section>

        <!-- Section Daftar Kontak -->
        <section class="card list-section">
          <div class="list-header">
            <!-- Counter jumlah kontak dinamis -->
            <h2>Daftar Kontak (<span id="contact-count">0</span>)</h2>
          </div>

          <!-- Pesan saat data/hasil filter kosong -->
          <div id="empty-state" class="empty-state" hidden>
            <p id="empty-message">Belum ada kontak yang ditambahkan.</p>
          </div>

          <!-- Container elemen <li> kontak yang dirender dari JS -->
          <ul id="contact-list" class="task-list"></ul>
        </section>
      </main>
    </div>
  </body>
</html>
